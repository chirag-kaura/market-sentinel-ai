apiVersion: v1
kind: Namespace
metadata:
  name: market-sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
  namespace: market-sentinel
  labels:
    app: sentinel-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-backend
  template:
    metadata:
      labels:
        app: sentinel-backend
    spec:
      containers:
        - name: backend
          image: market-sentinel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://sentinel:sentinel_secure_pass@postgres-service:5432/market_sentinel"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend-service
  namespace: market-sentinel
spec:
  type: ClusterIP
  selector:
    app: sentinel-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-frontend
  namespace: market-sentinel
  labels:
    app: sentinel-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-frontend
  template:
    metadata:
      labels:
        app: sentinel-frontend
    spec:
      containers:
        - name: frontend
          image: market-sentinel-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-frontend-service
  namespace: market-sentinel
spec:
  type: NodePort
  selector:
    app: sentinel-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
